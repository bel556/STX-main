<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | STX Auto-école</title>
  <link rel="stylesheet" href="../css/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="stx-navbar">
    <a href="landing.html" class="stx-logo">
      <img src="/STX/frontend/icons/car.svg" alt="Car logo">
      <span>STX Auto-école</span>
    </a>

    <div class="stx-menu-toggle" id="stx-menu-toggle">☰</div>

    <ul class="stx-nav-links" id="stx-nav-links">
      <li><a href="home-combined.html"><img src="/STX/frontend/icons/home.svg" alt=""> Accueil</a></li>
      <li><a href="search.html"><img src="/STX/frontend/icons/search.svg" alt=""> Recherche</a></li>
      <li><a href="registerschool1.html"><img src="/STX/frontend/icons/register-school.svg" alt=""> inscrire école</a></li>
      <li><a href="about.html"><img src="/STX/frontend/icons/icons8-info.svg" alt=""> À propos</a></li>
      <li><a href="contactus.html"><img src="/STX/frontend/icons/contact.svg" alt=""> Contact</a></li>
    </ul>

    <div class="stx-buttons">
      <a href="login.html" class="stx-login"><img src="/STX/frontend/icons/login.svg" alt=""> se connecter</a>
      <a href="signup.html" class="stx-signup"><img src="/STX/frontend/icons/user-plus.svg" alt=""> s'inscrire</a>
    </div>
  </header>

  <section class="login-section">
    <div class="login-box">
      <h2>Welcome Back</h2>
      <p>Sign in to your account to continue</p>

      <form id="loginForm">
        <input type="email" placeholder="Enter your email" id="email" required>
        <input type="password" placeholder="Enter your password" id="password" required>
        <button type="submit">Sign In</button>
      </form>

      <div class="or">or continue with</div>

      <div class="social-login">
        <button class="google">Continue with Google</button>
        <button class="facebook">Continue with Facebook</button>
      </div>

      <p class="links">
        Don’t have an account? <a href="#">Create one here</a><br>
        <a href="#">Forgot your password?</a>
      </p>
    </div>
  </section>

  <script src="../js/login.js"></script>
</body>
</html>
